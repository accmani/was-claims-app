# Log4j 1.x configuration for WAS deployment
# Migration: Replace with Logback + SLF4J (Spring Boot default)
# Replace log4j.properties with logback-spring.xml
# Add structured JSON logging via logstash-logback-encoder

log4j.rootLogger=INFO, WAS, FILE

# WAS System.out appender
log4j.appender.WAS=org.apache.log4j.ConsoleAppender
log4j.appender.WAS.layout=org.apache.log4j.PatternLayout
log4j.appender.WAS.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

# Rolling file appender
log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=${server.output.dir}/logs/claims-management.log
log4j.appender.FILE.MaxFileSize=50MB
log4j.appender.FILE.MaxBackupIndex=10
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n

# Package-level logging
log4j.logger.com.hcsc.claims=DEBUG
log4j.logger.com.hcsc.claims.util.PHIAuditLogger=INFO, AUDIT
log4j.logger.org.apache.openjpa.jdbc.SQL=WARN
log4j.logger.javax.persistence=WARN

# Separate audit appender — PHI access logs go here
log4j.appender.AUDIT=org.apache.log4j.RollingFileAppender
log4j.appender.AUDIT.File=${server.output.dir}/logs/phi-audit.log
log4j.appender.AUDIT.MaxFileSize=100MB
log4j.appender.AUDIT.MaxBackupIndex=50
log4j.appender.AUDIT.layout=org.apache.log4j.PatternLayout
log4j.appender.AUDIT.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %p %c - %m%n
log4j.additivity.com.hcsc.claims.util.PHIAuditLogger=false
