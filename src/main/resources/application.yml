# Generated by was-migration-platform from web.xml / ibm-*-bnd.xml / JNDI lookups.
# Every value is an environment placeholder: supply them per environment (never commit secrets).
spring:
  application:
    name: claims-management
  datasource:   # JNDI jdbc/hcscClaimsDS (WAS binding: jdbc/hcscClaimsDS)
    url: ${HCSCCLAIMSDS_URL}
    username: ${HCSCCLAIMSDS_USER}
    password: ${HCSCCLAIMSDS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jms:
    listener:
      session-transacted: true   # keeps MDB-style redelivery on failure
server:
  servlet:
    session:
      timeout: 30m
app:
  jms:
    claims-notification-queue: ${CLAIMSNOTIFICATIONQUEUE:claimsNotificationQueue}   # JNDI jms/claimsNotificationQueue
    payment-processing-queue: ${PAYMENTPROCESSINGQUEUE:paymentProcessingQueue}   # JNDI jms/paymentProcessingQueue
    member-portal-queue: ${MEMBERPORTALQUEUE:memberPortalQueue}   # JNDI jms/memberPortalQueue
ibm:
  mq:
    queue-manager: ${MQ_QMGR}
    channel: ${MQ_CHANNEL}
    conn-name: ${MQ_CONN_NAME}
    user: ${MQ_USER:}
    password: ${MQ_PASSWORD:}
    # JNDI connection factory jms/ClaimsConnectionFactory (WAS binding: jms/ClaimsConnectionFactory) is replaced by the auto-configured MQ ConnectionFactory
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
